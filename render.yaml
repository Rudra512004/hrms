databases:
  - name: beyondsure-postgres
    databaseName: hrms
    user: hrms_user
    plan: free

services:
  # Backend Django Web Service
  - type: web
    name: beyondsure-hrms-backend
    runtime: python
    branch: dev1
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beyondsure-postgres
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: beyondsure-hrms-frontend
          property: host
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: ""
      # Configure a real SMTP provider before inviting client employees.
      # Values are deliberately not stored in source control.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Frontend React Static Site
  - type: web
    name: beyondsure-hrms-frontend
    env: static
    branch: dev1
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: beyondsure-hrms-backend
          property: host
