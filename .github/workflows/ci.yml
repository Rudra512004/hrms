name: CI

on:
  push:
    branches: [ "main", "dev1", "dev2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "True"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/development.txt
      - name: Django Check
        run: |
          cd backend
          python manage.py check
          python manage.py check --deploy || true
      - name: Run Tests
        run: |
          cd backend
          python manage.py test --verbosity=2
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Tests
        run: |
          cd frontend
          npm run test
      - name: Type Check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Build frontend
        run: |
          cd frontend
          npm run build
